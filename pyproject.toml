[project]
name = "bnz"
version = "0.1.0"
description = "Binary NZB format - compressed binary representation of .nzb files"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0",
]

[project.scripts]
bnz = "bnz.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bnz"]
